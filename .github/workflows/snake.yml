name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: Platane/snk@master
        id: snake-svg
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to GitHub
        uses: actions/github-script@v6
        if: |-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            
            // Read the SVG files
            const snakeSvg = fs.readFileSync("dist/github-snake.svg", "utf8");
            const snakeDarkSvg = fs.readFileSync("dist/github-snake-dark.svg", "utf8");
            
            // Commit and push
            const { execSync } = require("child_process");
            execSync("git config user.name 'github-actions'");
            execSync("git config user.email 'github-actions@github.com'");
            execSync("git add dist/github-snake.svg dist/github-snake-dark.svg");
            
            try {
              execSync("git commit -m 'Generate snake animation'");
              execSync("git push");
            } catch (error) {
              console.log("No changes to commit");
            }
